name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: tag to build and release
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...
      - run: go test ./...

      - name: Build binaries
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          platforms="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"
          for platform in $platforms; do
            os="${platform%/*}"
            arch="${platform#*/}"
            name="prdash_${VERSION}_${os}_${arch}"
            workdir="build/${name}"
            mkdir -p "$workdir"

            binary="prdash"
            if [ "$os" = "windows" ]; then binary="prdash.exe"; fi

            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags="-s -w -X github.com/dreuse/prdash/internal/update.Version=${VERSION}" \
                -o "${workdir}/${binary}" .
            cp README.md "$workdir/"

            if [ "$os" = "windows" ]; then
              (cd build && zip -qr "../dist/${name}.zip" "$name")
            else
              tar -czf "dist/${name}.tar.gz" -C build "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -lh dist

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
